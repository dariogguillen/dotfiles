# Kitty config — mirrors ghostty/config

# Theme
include nordfox.conf

# Font
font_family      Fira Code
bold_font        family="Fira Code" style=Regular
italic_font      auto
bold_italic_font auto
font_size        7.5

# Window
# vertical horizontal (same as Ghostty: y=3, x=0)
window_padding_width 3 0
# Let KWin draw the frame (resizable edges); title bar hidden via kde/breezerc
hide_window_decorations no
confirm_os_window_close 0
background_opacity 0.8
# KDE Wayland ignores this; blur comes from Better Blur's force-blur (class: kitty)
background_blur 1

# Cursor
cursor_shape block
cursor_blink_interval 0
# Animated cursor trail
cursor_trail 1
# Keep the block cursor at the shell prompt
shell_integration no-cursor

# Mouse / selection
# Negative = hide the pointer as soon as you type
mouse_hide_wait -1
copy_on_select clipboard
enable_audio_bell no

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote access
allow_remote_control yes

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
