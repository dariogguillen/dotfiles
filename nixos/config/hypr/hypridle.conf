# Acciones por inactividad (hypridle). Tiempos en segundos.
general {
  lock_cmd = pidof hyprlock || hyprlock       # evita lanzar hyprlock dos veces
  before_sleep_cmd = loginctl lock-session     # bloquea antes de suspender
  after_sleep_cmd = hyprctl dispatch dpms on   # reenciende la pantalla al despertar
}

# A los 5 min: atenuar el brillo (se restaura al volver).
listener {
  timeout = 300
  on-timeout = brightnessctl -s set 10%
  on-resume = brightnessctl -r
}

# A los 10 min: bloquear la sesión.
listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

# A los 15 min: apagar la pantalla (dpms).
listener {
  timeout = 900
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}

# A los 30 min: suspender y, si sigue inactiva, hibernar (suspend-then-hibernate).
listener {
  timeout = 1800
  on-timeout = systemctl suspend-then-hibernate
}
