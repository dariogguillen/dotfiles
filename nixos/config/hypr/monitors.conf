# Monitores. Formato: monitor = puerto, resolución, posición, escala [, transform, N]
# Lista los actuales con: hyprctl monitors

# Panel del portátil.
monitor = eDP-1, 1920x1080@60, 0x0, 1

# ─── Monitores dockeados (de tu setup previo) ──────────────────────────────
# Hyprland los ignora mientras estén desconectados, así que quedan dormidos con
# la laptop sola y se activan solos al conectar en la oficina.
monitor = HDMI-A-1, preferred, -3444x0, 1
monitor = DP-1,     preferred, -4520x0, 1, transform, 3   # transform 3 = 270° (vertical)

# Fijar workspaces a monitores: 1-4 en HDMI, 5-6 en el DP-1 rotado, 7-10 en el
# panel del portátil (idéntico a tu Omarchy).
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
