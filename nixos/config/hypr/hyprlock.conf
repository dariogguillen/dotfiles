# Pantalla de bloqueo (hyprlock). Mínima por ahora; se afina en la Fase 4.
# Se lanza con SUPER+CTRL+ESC.

background {
  monitor =
  color = rgba(2e3440ff)
}

input-field {
  monitor =
  size = 250, 50
  outline_thickness = 2
  dots_size = 0.3
  dots_spacing = 0.3
  outer_color = rgba(88c0d0ff)
  inner_color = rgba(3b4252ff)
  font_color = rgba(eceff4ff)
  placeholder_text = <i>Contraseña...</i>
  position = 0, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_size = 64
  color = rgba(eceff4ff)
  position = 0, 120
  halign = center
  valign = center
}
