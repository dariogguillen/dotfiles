# Pantalla de bloqueo (hyprlock). Se lanza con SUPER+CTRL+ESC.
# Colores del tema activo ($bg, $inner, $accent, $fg).
source = ~/.config/current-theme/hyprlock.conf

background {
  monitor =
  color = $bg
}

input-field {
  monitor =
  size = 250, 50
  outline_thickness = 2
  dots_size = 0.3
  dots_spacing = 0.3
  outer_color = $accent
  inner_color = $inner
  font_color = $fg
  placeholder_text = <i>Contraseña...</i>
  position = 0, -20
  halign = center
  valign = center
}

label {
  monitor =
  text = $TIME
  font_size = 64
  color = $fg
  position = 0, 120
  halign = center
  valign = center
}
