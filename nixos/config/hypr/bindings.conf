# Atajos de teclado (portados de tu bindings.conf de Omarchy, con comandos
# nativos de NixOS en lugar de los wrappers omarchy-*/uwsm).

$mod     = SUPER
$term    = kitty
$browser = brave
$menu    = wofi --show drun

# ─── Aplicaciones ──────────────────────────────────────────────────────────
bind = $mod, RETURN, exec, $term
bind = $mod ALT, RETURN, exec, $term -e bash -c "tmux attach || tmux new -s Work"
bind = $mod SHIFT, RETURN, exec, $browser
bind = $mod, SPACE, exec, $menu
bind = $mod SHIFT, N, exec, $term -e nvim
bind = $mod SHIFT, M, exec, spotify

# ─── Gestión de ventanas ───────────────────────────────────────────────────
bind = $mod, W, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 0
bind = $mod, P, pseudo
bind = $mod, S, layoutmsg, togglesplit

# ─── Foco estilo vim (SUPER + hjkl) ────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# ─── Mover ventana (SUPER + CTRL + hjkl) ───────────────────────────────────
bind = $mod CTRL, H, movewindow, l
bind = $mod CTRL, L, movewindow, r
bind = $mod CTRL, K, movewindow, u
bind = $mod CTRL, J, movewindow, d

# ─── Redimensionar (SUPER + SHIFT + hjkl, repetible) ───────────────────────
binde = $mod SHIFT, H, resizeactive, -50 0
binde = $mod SHIFT, L, resizeactive, 50 0
binde = $mod SHIFT, K, resizeactive, 0 -50
binde = $mod SHIFT, J, resizeactive, 0 50

# ─── Workspaces (SUPER + número) ───────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Enviar ventana a workspace (SUPER + SHIFT + número)
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Cambiar de workspace con la rueda del ratón
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Arrastrar/redimensionar ventanas con el ratón + SUPER
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ─── Bloqueo (reubicado en SUPER+CTRL+ESC, como en tu setup) ────────────────
bind = $mod CTRL, ESCAPE, exec, hyprlock

# ─── Portapapeles con historial (cliphist + wofi) ──────────────────────────
bind = $mod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ─── Capturas de pantalla (al portapapeles) ────────────────────────────────
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, PRINT, exec, grim - | wl-copy

# ─── Gestores de archivos ──────────────────────────────────────────────────
bind = $mod, E, exec, kitty -e ranger        # ranger (terminal) — principal
bind = $mod SHIFT, F, exec, thunar           # Thunar (gráfico) — respaldo

# ─── Selector de tema global (wofi) ─────────────────────────────────────────
bind = $mod SHIFT, T, exec, ~/.config/hypr/scripts/theme.sh

# ─── Teclas multimedia / brillo ────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ─── Salir de Hyprland ─────────────────────────────────────────────────────
bind = $mod SHIFT, Q, exit
