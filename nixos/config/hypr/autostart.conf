# Procesos que arrancan con la sesión.

# Asegurar el symlink del tema activo (por defecto: nord) antes de que arranquen
# las apps que leen sus colores (mako, waybar…).
exec-once = bash -c 'test -e ~/.config/current-theme || ln -sfn ~/.config/themes/nord ~/.config/current-theme'

# Barra y notificaciones: ahora las gestiona systemd como servicios de usuario
# (ver home/desktop.nix), atadas a graphical-session.target. Ya no van aquí.

# El script arranca hyprpaper y aplica el fondo por IPC (fiable en el arranque).
exec-once = ~/.config/hypr/scripts/wallpaper.sh

# Inactividad (atenuar/bloquear/dpms/suspender).
exec-once = hypridle

# Agente de permisos (polkit) para diálogos de autenticación gráficos.
exec-once = systemctl --user start hyprpolkitagent.service

# Historial de portapapeles: registra texto e imágenes copiados.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Cursor Nord (Bibata) en el compositor.
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
