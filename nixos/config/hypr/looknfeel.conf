# Aspecto y sensación (portado de tu looknfeel.conf de Omarchy).

general {
  gaps_in = 2
  gaps_out = 4
  border_size = 2

  # Colores de borde (paleta Nord).
  col.active_border = rgba(88c0d0ee) rgba(5e81acee) 45deg
  col.inactive_border = rgba(3b4252aa)

  layout = dwindle
}

decoration {
  rounding = 8
  dim_inactive = true
  dim_strength = 0.15

  blur {
    enabled = true
    size = 6
    passes = 3
  }
}

animations {
  enabled = true
}

# Layout dwindle (mosaico binario, el clásico de tipo i3/Hyprland).
dwindle {
  preserve_split = true
}
