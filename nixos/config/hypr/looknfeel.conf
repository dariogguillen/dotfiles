# Aspecto y sensación (portado de tu looknfeel.conf de Omarchy).

general {
  gaps_in = 2
  gaps_out = 4
  border_size = 2

  # Colores de borde (del tema activo, ver ~/.config/current-theme/hypr.conf).
  col.active_border = $activeBorder
  col.inactive_border = $inactiveBorder

  layout = dwindle
}

decoration {
  rounding = 8
  dim_inactive = true
  dim_strength = 0.15

  blur {
    enabled = true
    size = 6
    passes = 3
  }
}

animations {
  enabled = true
}

# Layout dwindle (mosaico binario, el clásico de tipo i3/Hyprland).
dwindle {
  preserve_split = true
}

# Ventanas de monitoreo (btop lanzado desde waybar) -> flotantes y centradas.
# Sintaxis Hyprland 0.55: matcher (match:class ...) primero, regla después.
windowrule = match:class (monitor), float
windowrule = match:class (monitor), size 1000 650
windowrule = match:class (monitor), center
