# Hyprland — config principal (portada de tu setup de Omarchy a NixOS).
# Editable en vivo (symlink) + versionada en git. Tras editar: `hyprctl reload`.
# Docs: https://wiki.hypr.land/Configuring/

# Colores del tema activo (define $activeBorder / $inactiveBorder).
# El symlink ~/.config/current-theme lo cambia scripts/theme.sh.
source = ~/.config/current-theme/hypr.conf

# Se carga por partes (mismo estilo modular que usabas en Omarchy):
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/autostart.conf
