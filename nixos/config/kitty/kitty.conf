# kitty — portado de tu config de Omarchy, con tema Nord en línea (sin el include
# del tema de Omarchy). Editable en vivo + versionado.

# ─── Fuente ────────────────────────────────────────────────────────────────
font_family      FiraCode Nerd Font
bold_italic_font auto
font_size        10

# ─── Ventana ───────────────────────────────────────────────────────────────
window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0
# Transparencia (Hyprland aplica blur detrás; ver hypr/looknfeel.conf)
background_opacity 0.7
# Cursor animado
cursor_trail 1

# ─── Keybindings (tuyos) ───────────────────────────────────────────────────
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Enviar Shift+Enter como CSI-u para que los TUIs lo distingan de Enter.
map shift+enter send_text all \e[13;2u
# Alt+Shift+Enter como CSI-u para que tmux lo distinga.
map alt+shift+enter send_text all \e[13;4u

# Acceso remoto (útil para scripts/tmux)
allow_remote_control yes

# ─── Estética ──────────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 1
shell_integration no-cursor
enable_audio_bell no

# Barra de pestañas minimal
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# ─── Colores del tema activo ────────────────────────────────────────────────
# El symlink ~/.config/current-theme lo cambia scripts/theme.sh.
include ~/.config/current-theme/kitty.conf
