# ─── Personal: vim-style window navigation ──────────────────────────────
# Restored from my previous monolithic Hyprland config. These override some
# Omarchy defaults; the displaced actions (keybindings/hardware menu, split
# and layout toggles) stay reachable through the Omarchy menu.

# Free the keys Omarchy binds to hjkl before rebinding them below
unbind = SUPER, J           # was: Toggle window split
unbind = SUPER, K           # was: Show key bindings
unbind = SUPER, L           # was: Toggle workspace layout
unbind = SUPER CTRL, H      # was: Hardware menu
unbind = SUPER CTRL, L      # was: Lock system (moved to SUPER+CTRL+ESC below)

# Move focus
bindd = SUPER, H, Focus left,  movefocus, l
bindd = SUPER, L, Focus right, movefocus, r
bindd = SUPER, K, Focus up,    movefocus, u
bindd = SUPER, J, Focus down,  movefocus, d

# Move window
bindd = SUPER CTRL, H, Move window left,  movewindow, l
bindd = SUPER CTRL, L, Move window right, movewindow, r
bindd = SUPER CTRL, K, Move window up,    movewindow, u
bindd = SUPER CTRL, J, Move window down,  movewindow, d

# Resize window (repeatable)
binde = SUPER SHIFT, H, resizeactive, -50 0
binde = SUPER SHIFT, L, resizeactive, 50 0
binde = SUPER SHIFT, K, resizeactive, 0 -50
binde = SUPER SHIFT, J, resizeactive, 0 50

# Lock system, relocated off SUPER+CTRL+L
bindd = SUPER CTRL, ESCAPE, Lock system, exec, omarchy-system-lock
