# Personal environment variables — layered on top of Omarchy's default envs.conf.

# NVIDIA (Turing+ with GSP firmware) — Quadro T1000 / TU117 on nvidia-open.
# Mirrors Omarchy's official turing_plus block (install/config/hardware/nvidia.sh).
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
