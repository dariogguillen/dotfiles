# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# 1080p laptop panel at scale 1 (GDK_SCALE,2 was blowing up GTK apps).
env = GDK_SCALE,1
monitor=eDP-1,1920x1080@60,0x0,1

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# Or for ultrawide monitors like 34" 3440x1440 or 49" 5120x1440
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Portrait/rotated secondary monitor (transform: 1 = 90°, 3 = 270°)
# monitor = DP-2, preferred, auto, 1, transform, 1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# Disable the second ghost monitor on an Apple 6K XDR over Thunderbolt
# monitor=DP-2,disable

# ─── Personal: docked external monitors ─────────────────────────────────
# From my previous setup. Hyprland ignores these while disconnected, so they
# stay dormant on the laptop alone and activate automatically when docked.
monitor = HDMI-A-1, preferred, -3444x0, 1
monitor = DP-1,     preferred, -4520x0, 1, transform, 3

# Pin workspaces to monitors: 1-4 on HDMI, 5-6 on the rotated DP-1, 7-10 on
# the laptop. (Old config used "relative +1" for 5-6; pinned explicitly here.)
workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1
